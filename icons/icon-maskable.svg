<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: the OS may crop the corners into a circle/squircle.
       So we keep the important art in the SAFE area (inner 80%) and let
       the background fill the entire canvas. -->
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgm)"/>
  <!-- Slightly smaller bulb to stay inside the safe zone (256 ±100 px) -->
  <g transform="translate(256 256) scale(0.78)">
    <ellipse cx="0" cy="-40" rx="100" ry="105" fill="#FACC15" stroke="#FBBF24" stroke-width="4"/>
    <ellipse cx="-30" cy="-70" rx="35" ry="55" fill="#FEF3C7" opacity="0.55"/>
    <circle cx="0" cy="-30" r="20" fill="#FFFFFF" opacity="0.35"/>
    <rect x="-50" y="55" width="100" height="18" rx="6" fill="#94A3B8"/>
    <rect x="-50" y="78" width="100" height="14" rx="4" fill="#64748B"/>
    <path d="M -25 -20 Q -10 -50 0 -30 Q 10 -10 25 -20" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
